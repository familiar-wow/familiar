name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx biome ci

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Lua 5.1 with the bit library, as in the game, for the addon test.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends lua5.1 lua-bitop
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # Nobody on the team can start a Windows build before it ships, so CI does: built on Linux like
  # the test builds, started on Windows.
  windows-build:
    name: Windows build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build windows-x64
        working-directory: core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: familiar-windows
          path: core/dist/*-windows-x64/familiar.exe
          retention-days: 1

  windows:
    name: Windows
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: familiar-windows
          path: app
      - name: Start the app against an empty client folder
        shell: pwsh
        run: |
          $exe = (Get-ChildItem app -Recurse -Filter familiar.exe).FullName
          $version = & $exe --version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "familiar.exe --version printed '$version'" }
          $client = Join-Path $env:RUNNER_TEMP 'World of Warcraft\_forever_'
          New-Item -ItemType Directory -Force (Join-Path $client 'Interface\AddOns'), (Join-Path $client 'WTF\Account') | Out-Null
          $app = Start-Process $exe -ArgumentList '--wow', "`"$client`"", '--logs', "`"$env:RUNNER_TEMP\logs`"" -RedirectStandardOutput out.txt -RedirectStandardError err.txt -NoNewWindow -PassThru
          Start-Sleep -Seconds 10
          $quit = $app.HasExited
          if (-not $quit) { Stop-Process -Id $app.Id }
          Get-Content out.txt, err.txt
          if ($quit) { throw "familiar.exe quit with exit code $($app.ExitCode)" }
          if (-not (Select-String -Path out.txt -Pattern 'Ready\.' -Quiet)) { throw 'familiar.exe never got ready' }
          if (-not (Test-Path (Join-Path $client 'Interface\AddOns\Familiar\Familiar.toc'))) { throw 'the addon was not installed' }

  # The brain runs as a child process on stdin and stdout, and the font bank uses hard links:
  # both work differently on Windows. The `wow` server listens on a port there too. The
  # desktop app's sidecar uses the Windows Credential Manager, ssh.exe and reg.exe.
  windows-test:
    name: Windows test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test acp.test bank.test server.test game.test chatgpt.test model.test settings.test sidecar/
        working-directory: core

  # The desktop app's Rust shell: format, lints, tests, and that it builds with the pages embedded.
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - run: bun install --frozen-lockfile
      - run: cargo fmt --check
        working-directory: app/src-tauri
      - run: bun run tauri build --debug --no-bundle
        working-directory: app
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri
      # Includes the core's process tree: a hung core is killed with its children, and nothing
      # of a core that left by itself stays behind.
      - run: cargo test
        working-directory: app/src-tauri

  # The installer players get. Built and installed on Windows, then started against an empty
  # client folder: the app has to start its core, and the core has to install the addon, which
  # proves the whole chain from WebView2 through the Rust shell to the sidecar.
  windows-app:
    name: Windows app
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: familiar-windows
          path: core-build
      - run: bun install --frozen-lockfile
      - name: Build the installer
        shell: pwsh
        working-directory: app
        run: |
          $env:FAMILIAR_SIDECAR = (Get-ChildItem ..\core-build -Recurse -Filter familiar.exe).FullName
          bun run tauri build --bundles nsis
      - name: Install it, start it, and see the addon arrive
        shell: pwsh
        run: |
          $setup = (Get-ChildItem app\src-tauri\target\release\bundle\nsis -Filter *-setup.exe).FullName
          $client = Join-Path $env:RUNNER_TEMP 'World of Warcraft\_forever_'
          New-Item -ItemType Directory -Force (Join-Path $client 'Interface\AddOns'), (Join-Path $client 'WTF\Account') | Out-Null
          $folder = Join-Path $env:APPDATA 'Familiar'
          New-Item -ItemType Directory -Force $folder | Out-Null
          @{ game = @{ client = $client } } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $folder 'settings.json')
          $install = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Familiar\Familiar.exe'
          if (-not (Test-Path $exe)) { throw "no $exe after installing" }
          $app = Start-Process $exe -PassThru
          $toc = Join-Path $client 'Interface\AddOns\Familiar\Familiar.toc'
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $toc) -and (Get-Date) -lt $deadline -and -not $app.HasExited) { Start-Sleep -Seconds 2 }
          Get-ChildItem (Join-Path $folder 'logs') -ErrorAction SilentlyContinue | Get-Content -Tail 20
          if ($app.HasExited) { throw "Familiar.exe quit with exit code $($app.ExitCode)" }
          if (-not (Test-Path $toc)) { throw 'the app did not get the addon installed' }
          if (-not (Get-Process familiar-core -ErrorAction SilentlyContinue)) { throw 'no familiar-core process' }
          # Killed without a word, the app leaves its core with a closed stdin: it has to go too.
          Stop-Process -Id $app.Id -Force
          $deadline = (Get-Date).AddSeconds(15)
          while ((Get-Process familiar-core -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Get-Process familiar-core -ErrorAction SilentlyContinue) { throw 'familiar-core kept running after the app was gone' }
      # Unsigned for now (FAM-18): Windows SmartScreen warns before it runs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: familiar-setup-windows
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 14

  # The Linux packages for testers: built on the oldest supported Ubuntu, so the AppImage and the
  # deb run on more systems (glibc). Then the built app starts against an empty client folder, as
  # on Windows: the addon has to arrive and the core has to go with the app.
  linux-app:
    name: Linux app
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb xauth
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --bundles deb,appimage
        working-directory: app
      - name: Start the app and see the addon arrive
        run: |
          client="$RUNNER_TEMP/World of Warcraft/_forever_"
          mkdir -p "$client/Interface/AddOns" "$client/WTF/Account" "$RUNNER_TEMP/cfg"
          printf '{"game":{"client":"%s"}}\n' "$client" > "$RUNNER_TEMP/cfg/settings.json"
          export FAMILIAR_SETTINGS="$RUNNER_TEMP/cfg/settings.json"
          xvfb-run -a dbus-run-session -- bash -c '
            app/src-tauri/target/release/Familiar > "$RUNNER_TEMP/app.log" 2>&1 & app=$!
            toc="$0/Interface/AddOns/Familiar/Familiar.toc"
            for i in $(seq 1 45); do [ -f "$toc" ] && break; sleep 2; done
            tail -n 20 "$RUNNER_TEMP/app.log"
            [ -f "$toc" ] || { echo "the app did not get the addon installed"; exit 1; }
            pgrep -x familiar-core > /dev/null || { echo "no familiar-core process"; exit 1; }
            kill -TERM $app
            for i in $(seq 1 15); do pgrep -x familiar-core > /dev/null || break; sleep 1; done
            if pgrep -x familiar-core > /dev/null; then echo "familiar-core kept running after the app was gone"; exit 1; fi
          ' "$client"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: familiar-linux
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

  # The only check the ruleset for main requires. Add every new job to `needs`.
  all-passed:
    name: All passed
    if: always()
    needs:
      [
        biome,
        test,
        windows-build,
        windows,
        windows-test,
        app,
        windows-app,
        linux-app,
      ]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
