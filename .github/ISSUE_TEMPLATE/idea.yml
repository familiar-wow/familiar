name: Idea
description: Suggest a feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the situation in the game and what is missing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could Familiar help?
